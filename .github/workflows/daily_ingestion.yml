name: Daily Financial Ingestion Pipeline

on:
  schedule:
    # Executa todos os dias às 03:00 AM UTC (00:00 Horário de Brasília)
    - cron: '0 3 * * *'
  # Permite disparar o pipeline manualmente a qualquer momento pela aba Actions no GitHub
  workflow_dispatch:

jobs:
  run-ingestion:
    name: Run Daily Ingestion to BigQuery Landing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup GCP Service Account Credentials
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          mkdir -p credenciais
          python -c "
          import os, base64, json, ast, sys
          raw = os.environ.get('GCP_SA_KEY', '').strip()
          if not raw:
              print('ERRO CRÍTICO: Secret GCP_SA_KEY está VAZIO no GitHub Secrets!', file=sys.stderr)
              sys.exit(1)
          try:
              decoded = base64.b64decode(raw).decode('utf-8').strip()
              if decoded.startswith('{'):
                  raw = decoded
          except Exception:
              pass
          data_dict = None
          try:
              data_dict = json.loads(raw)
          except Exception:
              try:
                  data_dict = ast.literal_eval(raw)
              except Exception as e:
                  print(f'ERRO AO PROCESSAR JSON DO GCP: {e}', file=sys.stderr)
                  sys.exit(1)
          if not isinstance(data_dict, dict) or 'type' not in data_dict:
              print(f'ERRO: O objeto decodificado não é um dicionário válido do GCP! Tipo: {type(data_dict)}', file=sys.stderr)
              sys.exit(1)
          with open('credenciais/chave_conta_servico.json', 'w') as f:
              json.dump(data_dict, f, indent=2)
          print('Credencial GCP salva com sucesso! Projeto:', data_dict.get('project_id'))
          "

      - name: Execute Daily Ingestion Pipeline
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          GOOGLE_APPLICATION_CREDENTIALS: credenciais/chave_conta_servico.json
          BQ_DATASET_LANDING: landing
          BQ_DATASET_BRONZE: bronze
          BQ_DATASET_SILVER: silver
          BQ_DATASET_GOLD: gold
          FMP_BASE_URL: https://financialmodelingprep.com/stable
          FMP_INCOME_STATEMENT_ENDPOINT: /income-statement
          FMP_BALANCE_SHEET_ENDPOINT: /balance-sheet-statement
          FMP_CASH_FLOW_ENDPOINT: /cash-flow-statement
          FMP_PROFILE_ENDPOINT: /profile
          FMP_QUOTE_ENDPOINT: /quote
          DEFAULT_SYMBOL: MSFT
          LOG_LEVEL: INFO
        run: |
          python tests/test_ingestion_service.py
