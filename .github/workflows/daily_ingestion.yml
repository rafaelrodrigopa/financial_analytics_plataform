name: Daily Financial Ingestion Pipeline

on:
  schedule:
    # Executa todos os dias às 03:00 AM UTC (00:00 Horário de Brasília)
    - cron: '0 3 * * *'
  # Permite disparar o pipeline manualmente a qualquer momento pela aba Actions no GitHub
  workflow_dispatch:

jobs:
  run-ingestion:
    name: Run Daily Ingestion to BigQuery Landing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup GCP Service Account Credentials
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          mkdir -p credenciais
          python -c "import os, base64, json, ast; raw=os.environ.get('GCP_SA_KEY','').strip(); data=None; [exec('try:\n data=base64.b64decode(raw).decode(\"utf-8\")\nexcept:\n try:\n  data=json.loads(raw)\n except:\n  data=json.dumps(ast.literal_eval(raw))\n')]; content = data if isinstance(data, str) else json.dumps(data, indent=2); open('credenciais/chave_conta_servico.json', 'w').write(content); print('Credencial GCP configurada com sucesso! Projeto:', json.loads(content).get('project_id'))"

      - name: Execute Daily Ingestion Pipeline
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          GOOGLE_APPLICATION_CREDENTIALS: credenciais/chave_conta_servico.json
          BQ_DATASET_LANDING: landing
          BQ_DATASET_BRONZE: bronze
          BQ_DATASET_SILVER: silver
          BQ_DATASET_GOLD: gold
          FMP_BASE_URL: https://financialmodelingprep.com/stable
          FMP_INCOME_STATEMENT_ENDPOINT: /income-statement
          FMP_BALANCE_SHEET_ENDPOINT: /balance-sheet-statement
          FMP_CASH_FLOW_ENDPOINT: /cash-flow-statement
          FMP_PROFILE_ENDPOINT: /profile
          FMP_QUOTE_ENDPOINT: /quote
          DEFAULT_SYMBOL: MSFT
          LOG_LEVEL: INFO
        run: |
          python tests/test_ingestion_service.py
